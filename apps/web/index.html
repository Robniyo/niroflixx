    <div id="root"></div>

    <!-- Google login button template (hidden until inserted into login form) -->
    <template id="google-btn-template">
      <div class="mb-6 flex justify-center">
        <a href="https://niroflixx.onrender.com/api/v1/auth/google"
           class="flex items-center gap-2 px-6 py-3 border rounded-full hover:bg-secondary-50 transition-colors"
           style="display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px;
                  background: white; color: #1a1a2e; border: 1px solid #e2e8f0; border-radius: 50px;
                  text-decoration: none; font-family: 'Inter', sans-serif; font-weight: 500;
                  box-shadow: 0 8px 24px rgba(0,0,0,0.08);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>
      </div>
    </template>

    <script>
      (function() {
        const template = document.getElementById('google-btn-template');
        let lastPath = location.pathname;

        function insertButton() {
          // Only on /login page
          if (location.pathname !== '/login') return;

          // Wait for the login form to render
          const form = document.querySelector('form'); // the email/password form
          const submitBtn = form?.querySelector('button[type="submit"]'); // the "Sign In" button

          if (form && submitBtn) {
            // Remove any previously inserted button
            const existing = document.getElementById('dynamic-google-btn');
            if (existing) existing.remove();

            // Clone the template content and insert after the submit button
            const clone = template.content.cloneNode(true);
            const wrapper = clone.firstElementChild;
            if (wrapper) {
              wrapper.id = 'dynamic-google-btn';
              submitBtn.parentNode.insertBefore(wrapper, submitBtn.nextSibling);
            }
          }
        }

        // Try to insert on initial load and on URL changes
        function onUrlChange() {
          if (location.pathname !== lastPath) {
            lastPath = location.pathname;
            // Wait a bit for React to render
            setTimeout(insertButton, 100);
          }
        }

        // Observe DOM changes as a fallback
        const observer = new MutationObserver(() => {
          if (location.pathname === '/login') insertButton();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Listen for SPA navigation
        const originalPush = history.pushState;
        const originalReplace = history.replaceState;
        history.pushState = function(...args) {
          originalPush.apply(this, args);
          onUrlChange();
        };
        history.replaceState = function(...args) {
          originalReplace.apply(this, args);
          onUrlChange();
        };
        window.addEventListener('popstate', onUrlChange);

        // Initial run
        onUrlChange();
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
