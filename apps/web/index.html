  <body>
    <div id="root"></div>

    <!-- Google login button (only visible on /login) -->
    <div id="google-login-btn">
      <a href="https://niroflixx.onrender.com/api/v1/auth/google">

          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>

      </a>

    <!-- Toggle button visibility based on URL (no DOM mutation inside React) -->
    <script>
      (function() {
        const btn = document.getElementById('google-login-btn');
        function toggle() {
          if (window.location.pathname === '/login') {
            btn.classList.add('visible');
          } else {
            btn.classList.remove('visible');
          }
        }
        // Run on page load
        toggle();
        // Handle SPA navigation
        window.addEventListener('popstate', toggle);
        const originalPush = history.pushState;
        const originalReplace = history.replaceState;
        history.pushState = function(...args) {
          originalPush.apply(this, args);
          toggle();
        };
        history.replaceState = function(...args) {
          originalReplace.apply(this, args);
          toggle();
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
